# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Formalization of Scott's Measurement Structures and Linear Inequalities in Lean 4"
  description: >-
    A Lean 4 / mathlib formalization of Dana Scott's 1964 paper *Measurement
    Structures and Linear Inequalities* (Journal of Mathematical Psychology 1
    (1964), 233–247). The paper derives necessary and sufficient conditions
    for three finite representation problems — intransitive indifference,
    ordered differences, and subjective probability — from the general
    solvability criterion for finite systems of linear inequalities. The
    development also covers Scott's ordered-group and signed-charge remarks,
    literal vector cancellation, and the KPS obstruction to de Finetti's five
    axioms. Every compared equivalence is described predicate-by-predicate in
    Challenge.lean and the README, including its numerical-representation side
    and its qualitative cancellation, permutation, reversal, probability, or
    Kelley-cover side. The additional infinite theorem is a new, stronger
    modern characterization first stated in this project; it adapts Kelley's
    1959 countable-cover/separation method and is not attributed to Scott.
    The Lean development was drafted with AI-agent assistance under Lars
    Warren Ericson's direction and review. Dana S. Scott, Vijay
    D'Silva, and Brian Milnes are co-authors of the formalization report.
    There is no sorry outside the deliberate
    holes in Challenge.lean, no project-defined axiom, and Mathlib is the only
    Lake dependency.
  authors:
    - "Lars Warren Ericson"
    - "Dana S. Scott"
    - "Vijay D'Silva"
    - "Brian Milnes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

repository:
  role: substantive-development

classification:
  arxiv: [cs.LO, math.LO, econ.TH]
  msc2020: ["91C05", "15A39", "91B16", "68V20"]

status:
  scope: >-
    Complete sorry-free formalizations of Scott's eight numbered theorems
    1.1–1.4, 2.1, 3.1, 3.2, and 4.1. Challenge.lean contains the deliberate
    Palomar proof holes, while Solution.lean re-exports all proofs. A ninth
    compared result is explicitly labelled as a modern reconstruction of the
    infinite probability theorem Scott announced but did not publish here.
    It is an iff characterization for arbitrary Boolean algebras, not merely
    an existence implication: finite-additive probability representation is
    equivalent to nontriviality, bottom-minimality, totality, and an explicit
    generalized Kelley cover of strict-comparison vectors over the closed
    weak-comparison cone. Scott's final sentence contains no recoverable
    theorem statement against which to identify this stronger result.
    Supplementary results cover finite local embeddings of linearly ordered
    abelian groups and the lexicographic global obstruction, literal vector
    cancellation and signed charges, and an integrated KPS counterexample to
    sufficiency of the bundled de Finetti axioms.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - "Scott1964.MeasurementStructures.LinearInequalities.scott_theorem_1_1"
    - "Scott1964.MeasurementStructures.LinearInequalities.scott_theorem_1_2"
    - "Scott1964.MeasurementStructures.LinearInequalities.scott_theorem_1_3"
    - "Scott1964.MeasurementStructures.LinearInequalities.scott_theorem_1_4"
    - "Scott1964.MeasurementStructures.theorem_2_1"
    - "Scott1964.MeasurementStructures.theorem_3_1"
    - "Scott1964.MeasurementStructures.theorem_3_2"
    - "Scott1964.MeasurementStructures.theorem_4_1"
    - "Scott1964.MeasurementStructures.Probability.Infinite.reconstructed_infinite_theorem_4_1"

fidelity:
  divergences: >-
    Working source: sources/ScottMeasurement1964.pdf (a vision transcription
    sources/ScottMeasurement1964_vision.md is produced by
    scripts/ocr_pdf_pipeline.sh). Section 4 of arxiv.md is an exhaustive
    paper-order concordance (verbatim Scott passage, exact Lean fragment or
    an explicit gap, and a Lean-driven mathematical reconstruction). Coverage,
    quotations, and declaration names are checked by
    scripts/check_concordance.py; cards are emitted by
    scripts/emit_concordance.py. Challenge.lean renders Scott's condition
    (4_B) with the atom-counting reading of the algebraic sum of
    characteristic functions, which Scott gives in words immediately after
    the theorem; theorem_4_1_vector separately proves the equivalent literal
    vector-sum form. Theorem 2.1 currently uses the direct Scott–Suppes
    staircase construction, while Scott's local cycle reductions are
    formalized separately. Exact divergences are listed in known_gaps and in
    arxiv.md. The reconstructed infinite theorem is first stated and proved in
    this project. Its countable-cover and separator-combination argument adapts
    Kelley's 1959 measure-existence method, but its universal event-span
    formulation, weak-comparison cone, generalized Kelley condition, and iff
    statement are not claimed to occur in Kelley or Scott.

sources:
  - title: "Measurement Structures and Linear Inequalities"
    authors: ["Dana S. Scott"]
    type: "article"
    location: >-
      Journal of Mathematical Psychology, Volume 1, 1964, pages 233-247.
    relationship: formalizes
    author_endorsement: participated
    note: >-
      Primary source. Dana S. Scott suggested the paper as a formalization
      target and is a co-author, with Lars Warren Ericson, Vijay D'Silva,
      and Brian Milnes, of the resulting technical report. Working PDF:
      sources/ScottMeasurement1964.pdf.
  - title: "Measures on Boolean Algebras"
    authors: ["J. L. Kelley"]
    type: "paper"
    location: >-
      Pacific Journal of Mathematics, Volume 9, 1959, pages 1165-1177.
    relationship: adapts
    note: >-
      The modern infinite reconstruction adapts Kelley's use of a countable
      cover and Hahn-Banach separation to obtain a strictly positive measure.
      The precise universal event-span construction, weak-comparison cone,
      GeneralizedKelleyCondition, and necessary-and-sufficient theorem are
      first stated and proved in this project. They are not attributed to
      Kelley and are not identified with the theorem Scott announced but did
      not state in his closing paragraph.

