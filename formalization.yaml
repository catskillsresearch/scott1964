review:
  status: self-assessed
  reviewers:
    - "Lars Warren Ericson"
  notes: >-
    Lars Warren Ericson directed and reviewed the Lean development. Dana S.
    Scott, Vijay D'Silva, and Brian Milnes are co-authors of the report; this
    is not recorded as an independent external review of the Lean source.
    Every proof step is checked by the Lean kernel.

known_gaps:
  - >-
    Scott's closing paragraph does not state the hypotheses or conclusion of
    his announced infinite extension. The repository's infinite result is a
    new, stronger modern Hahn–Banach/Kelley iff characterization under an
    explicit generalized Kelley condition. It adapts the method of Kelley
    (1959), but its exact statement is first presented here; it is not a
    recovery or attribution of Scott's unpublished theorem.
  - >-
    Theorem 2.1 is proved by the direct finite Scott–Suppes construction.
    Scott's 1964 local cycle-shortening lemmas are formalized, but there is no
    completed Preference/LinearProof module assembling them into an alternate
    proof through the section-1 linear-inequality machinery.

limitations:
  - >-
    No external mathematical review has been performed.
  - >-
    Challenge.lean may contain deliberate sorries; Solution.lean and
    Scott1964/MeasurementStructures/* must not.

alignment:
  namespace: "Scott1964.MeasurementStructures"
  statements:
    - source: "Theorems 1.1–1.4 (finite linear inequalities)"
      lean: "LinearInequalities.scott_theorem_1_1 through scott_theorem_1_4"
      module: "Scott1964.MeasurementStructures.LinearInequalities.ScottTheorems"
      status: proved
      note: >-
        On the numerical side, one linear functional must reproduce exactly
        the prescribed nonnegative vectors or weak relation. Theorem 1.1's
        qualitative side is sign completeness plus cancellation of every
        positive-real-weighted zero sum: each participating vector must also
        have its negative declared nonnegative. Theorem 1.2 assumes finite
        rational coordinates and replaces positive weights by unweighted
        repeated summands. Theorem 1.3 requires completeness and says that
        termwise-related finite sequences with equal vector sums must be ties,
        so every termwise comparison reverses. Theorem 1.4 instead requires an
        extension to the additive closure that is complete, preserves
        comparison under addition, and cancels equal totals.
    - source: "Theorem 2.1 (intransitive indifference)"
      lean: "theorem_2_1"
      module: "Scott1964.MeasurementStructures.Preference.Intransitive"
      status: proved
      note: >-
        The numerical side is xPy iff f(x) >= f(y) + 1. The qualitative side
        is irreflexivity plus the two displayed four-alternative axioms
        PrefQuadA and PrefQuadB.
    - source: "Theorem 3.1 (additive utility for pairs)"
      lean: "theorem_3_1"
      module: "Scott1964.MeasurementStructures.Differences.Pair"
      status: proved
      note: >-
        The numerical side represents each mixed pair by f(x)+f'(x'). The
        qualitative side requires totality and independent-permutation
        cancellation: after independently permuting the first and second
        coordinates of a finite list, comparisons at every non-distinguished
        position force the remaining comparison in reverse.
    - source: "Theorem 3.2 (ordered differences)"
      lean: "theorem_3_2"
      module: "Scott1964.MeasurementStructures.Differences.Ordered"
      status: proved
      note: >-
        The numerical side represents D(x,y,z,w) exactly by
        f(x)-f(y) >= f(z)-f(w). The qualitative side requires totality, the
        analogous independent-permutation cancellation scheme, and reversal:
        D(x,y,z,w) implies D(w,z,y,x).
    - source: "Theorem 4.1 (subjective probability)"
      lean: "theorem_4_1"
      module: "Scott1964.MeasurementStructures.Probability.Finite"
      status: proved
      note: >-
        The numerical side is exact representation by a nonnegative,
        normalized, finitely additive probability. The four qualitative
        conditions are: top is weakly above bottom but not conversely; every
        event is weakly above bottom; every two events are comparable; and
        atom-count cancellation. The last condition says that, for two finite
        event lists in which every atom occurs equally often on both sides,
        comparisons at all non-distinguished positions force the distinguished
        comparison in reverse. theorem_4_1_vector proves the equivalent
        literal characteristic-vector form.
    - source: "Page 15 signed-measure characterization"
      lean: "scott_p15_signed_charge; scott_p15_signed_charge_vector"
      module: "Scott1964.MeasurementStructures.Probability.Finite"
      status: proved
      note: "Completeness and cancellation characterize finitely additive signed charges."
    - source: "Ordered-group remarks after Theorem 1.4"
      lean: "LinearInequalities.finite_local_real_embedding"
      module: "Scott1964.MeasurementStructures.LinearInequalities.OrderedGroup"
      status: proved
      note: "Includes a lexicographic strictly-monotonic example and global real obstruction."
    - source: "Kraft–Pratt–Seidenberg counterexample"
      lean: "Probability.KPSCounterexample.deFinetti_axioms_insufficient"
      module: "Scott1964.MeasurementStructures.Probability.KPSCounterexample"
      status: proved
      note: "Bundled de Finetti axioms hold, but RealizableProbability fails."
    - source: "Closing-paragraph announcement of an infinite extension"
      lean: "Probability.Infinite.reconstructed_infinite_theorem_4_1"
      module: "Scott1964.MeasurementStructures.Probability.Infinite.Reconstructed"
      status: proved
      note: >-
        New modern iff characterization first presented here, adapting
        Kelley's 1959 countable-cover/separation method; not attributed as
        Scott's unpublished theorem. The numerical side is exact
        representation on an arbitrary Boolean algebra by a nonnegative,
        normalized, finitely additive probability. Besides nontriviality,
        bottom-minimality, and totality, the qualitative side requires a
        GeneralizedKelleyCondition. Event differences x-y are embedded in the
        normed span of evaluation functions over all finitely additive
        probabilities. The weak-comparison cone is the closed dual-polar cone
        forced nonnegative by every continuous linear functional that is
        nonnegative on declared weak comparisons. Strict comparisons are the
        vectors x-y for which the reverse weak comparison fails. They must lie
        in the weak cone and admit a countable cover by closed convex layers,
        each avoiding zero and upper-closed under addition of weak-cone
        vectors. Exhaustive passage-level alignment of the 1964 source lives
        in arxiv.md §4 rather than as additional compared theorems.
